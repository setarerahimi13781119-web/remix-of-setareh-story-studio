name: Portfolio quality checks

on:
  push:
    branches:
      - portfolio-release-candidate
      - portfolio-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Format SelectedWork source
        run: bunx prettier --write src/components/portfolio/SelectedWork.tsx

      - name: Upload formatted source for commit
        uses: actions/upload-artifact@v4
        with:
          name: formatted-selected-work
          path: src/components/portfolio/SelectedWork.tsx
          if-no-files-found: error

      - name: Print formatted source for retrieval
        run: |
          echo "BEGIN_FORMATTED_SELECTED_WORK"
          cat src/components/portfolio/SelectedWork.tsx
          echo "END_FORMATTED_SELECTED_WORK"

      - name: Check Prettier formatting
        run: bunx prettier --check src/data/portfolio.ts src/routes/index.tsx src/test/portfolio-data.test.ts src/components/portfolio/Portfolio.tsx src/components/portfolio/SelectedWork.tsx

      - name: Run lint
        run: bun run lint

      - name: Build production bundle
        run: bun run build
