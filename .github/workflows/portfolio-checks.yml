name: Portfolio quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Apply repository formatting
        run: bunx prettier --write .

      - name: Run lint
        run: bun run lint

      - name: Build production app
        run: bun run build
