name: Portfolio quality checks

on:
  push:
    branches:
      - main
      - portfolio-release-candidate
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check Prettier formatting
        run: bunx prettier --check src

      - name: Run lint
        run: bun run lint

      - name: Build production bundle
        run: bun run build
