name: Portfolio quality checks

on:
  push:
    branches:
      - portfolio-release-candidate
      - portfolio-completion
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Format SelectedWork source
        run: bunx prettier --write src/components/portfolio/SelectedWork.tsx

      - name: Commit Prettier formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/portfolio/SelectedWork.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format SelectedWork with Prettier"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check Prettier formatting
        run: bunx prettier --check src/data/portfolio.ts src/routes/index.tsx src/test/portfolio-data.test.ts src/components/portfolio/Portfolio.tsx src/components/portfolio/SelectedWork.tsx

      - name: Run lint
        run: bun run lint

      - name: Build production bundle
        run: bun run build
